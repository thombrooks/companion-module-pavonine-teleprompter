name: Native TLS prebuilds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-host:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            publish: true
          - os: windows-latest
            platform: win32
            arch: x64
            publish: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: corepack enable && yarn install --immutable
      - name: Install Mbed TLS build dependencies
        run: python -m pip install -r scripts/requirements-mbedtls.txt
      - name: Compile portable TLS addon
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then
            MBEDTLS_PYTHON="$(command -v python)" sh scripts/prepare-mbedtls-generated.sh native-build
            mkdir -p native-build
            curl -fsSL "https://nodejs.org/dist/v$(node -p process.versions.node)/win-x64/node.lib" -o native-build/node.lib
          fi
          cmake -S native -B native-build \
            -DNODE_API_INCLUDE="$PWD/node_modules/node-api-headers/include" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/native-build/output" \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DNODE_LIBRARY="$PWD/native-build/node.lib"
          cmake --build native-build --target teleprompter_tls_addon --config Release --parallel
      - name: Load the compiled N-API addon
        shell: bash
        run: >-
          node -e "const a=require('./native-build/output/teleprompter-tls-addon.node'); if(typeof a.start !== 'function'||typeof a.send !== 'function') process.exit(1)"
      - name: Verify build path is not embedded
        shell: bash
        run: >-
          node -e "const b=require('node:fs').readFileSync('native-build/output/teleprompter-tls-addon.node'); if(b.includes(Buffer.from(process.env.GITHUB_WORKSPACE))) process.exit(1)"
      - name: Stage package prebuild
        if: matrix.publish
        shell: bash
        run: >-
          node_modules/.bin/pkg-prebuilds-copy
          --baseDir native-build/output --source teleprompter-tls-addon.node
          --name teleprompter-tls-addon --napi_version 10
          --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - name: Upload package prebuild
        if: matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: tls-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/teleprompter-tls-addon-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  windows-arm64:
    name: win32-arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: corepack enable && yarn install --immutable
      - name: Install Mbed TLS build dependencies
        run: python -m pip install -r scripts/requirements-mbedtls.txt
      - name: Prepare generated Mbed TLS sources
        shell: bash
        run: |
          MBEDTLS_PYTHON="$(command -v python)" sh scripts/prepare-mbedtls-generated.sh native-build
          mkdir -p native-build
          curl -fsSL "https://nodejs.org/dist/v$(node -p process.versions.node)/win-arm64/node.lib" -o native-build/node.lib
      - name: Cross-compile portable TLS addon
        shell: bash
        run: |
          cmake -S native -B native-build -A ARM64 \
            -DNODE_API_INCLUDE="$PWD/node_modules/node-api-headers/include" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/native-build/output" \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DNODE_LIBRARY="$PWD/native-build/node.lib"
          cmake --build native-build --target teleprompter_tls_addon --config Release --parallel
      - name: Verify Windows ARM64 binary format
        shell: bash
        run: >-
          node -e "const b=require('node:fs').readFileSync('native-build/output/teleprompter-tls-addon.node'); const o=b.readUInt32LE(0x3c); if(b.toString('ascii',0,2)!=='MZ'||b.toString('ascii',o,o+4)!=='PE\\0\\0'||b.readUInt16LE(o+4)!==0xaa64) process.exit(1)"
      - name: Verify build path is not embedded
        shell: bash
        run: >-
          node -e "const b=require('node:fs').readFileSync('native-build/output/teleprompter-tls-addon.node'); if(b.includes(Buffer.from(process.env.GITHUB_WORKSPACE))) process.exit(1)"
      - name: Stage package prebuild
        shell: bash
        run: >-
          node_modules/.bin/pkg-prebuilds-copy
          --baseDir native-build/output --source teleprompter-tls-addon.node
          --name teleprompter-tls-addon --napi_version 10
          --platform win32 --arch arm64
      - name: Upload package prebuild
        uses: actions/upload-artifact@v4
        with:
          name: tls-win32-arm64
          path: prebuilds/teleprompter-tls-addon-win32-arm64
          if-no-files-found: error

  linux-cross:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            compiler: aarch64-linux-gnu
            processor: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: bash
        run: >-
          sudo apt-get update && sudo apt-get install -y
          gcc-${{ matrix.compiler }} g++-${{ matrix.compiler }}
          && python -m pip install -r scripts/requirements-mbedtls.txt
          && corepack enable && yarn install --immutable
      - name: Cross-compile portable TLS addon
        shell: bash
        run: >-
          cmake -S native -B native-build
          -DNODE_API_INCLUDE="$PWD/node_modules/node-api-headers/include"
          -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/native-build/output"
          -DPython3_EXECUTABLE="$(command -v python)"
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="${{ matrix.processor }}"
          -DCMAKE_C_COMPILER="${{ matrix.compiler }}-gcc"
          -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}-g++"
          && cmake --build native-build --target teleprompter_tls_addon --parallel
      - name: Verify Linux ARM64 binary format
        shell: bash
        run: >-
          node -e "const b=require('node:fs').readFileSync('native-build/output/teleprompter-tls-addon.node'); if(b[0]!==0x7f||b.toString('ascii',1,4)!=='ELF'||b.readUInt16LE(18)!==183) process.exit(1)"
      - name: Verify build path is not embedded
        shell: bash
        run: >-
          node -e "const b=require('node:fs').readFileSync('native-build/output/teleprompter-tls-addon.node'); if(b.includes(Buffer.from(process.env.GITHUB_WORKSPACE))) process.exit(1)"
      - name: Stage package prebuild
        shell: bash
        run: >-
          node_modules/.bin/pkg-prebuilds-copy
          --baseDir native-build/output --source teleprompter-tls-addon.node
          --name teleprompter-tls-addon --napi_version 10
          --platform linux --arch "${{ matrix.arch }}"
      - name: Upload package prebuild
        uses: actions/upload-artifact@v4
        with:
          name: tls-linux-${{ matrix.arch }}
          path: prebuilds/teleprompter-tls-addon-linux-${{ matrix.arch }}
          if-no-files-found: error

  package:
    name: consolidated package
    needs: [native-host, windows-arm64, linux-cross]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: corepack enable && yarn install --immutable
      - name: Install Mbed TLS build dependencies
        run: python -m pip install -r scripts/requirements-mbedtls.txt
      - name: Download Linux and Windows prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: tls-*
          path: downloaded-prebuilds
      - name: Stage downloaded prebuilds
        shell: bash
        run: |
          for artifact in downloaded-prebuilds/tls-*; do
            target="${artifact#downloaded-prebuilds/tls-}"
            mkdir -p "prebuilds/teleprompter-tls-addon-$target"
            mv "$artifact/node-napi-v10.node" "prebuilds/teleprompter-tls-addon-$target/node-napi-v10.node"
          done
      - name: Build consolidated package
        run: >-
          MBEDTLS_PYTHON="$(command -v python)" yarn build
          && yarn exec companion-module-build --output pavonine-teleprompter-${{ github.sha }}
      - name: Verify package native payloads
        run: node scripts/verify-package.mjs pavonine-teleprompter-${{ github.sha }}.tgz
      - name: Upload consolidated package
        uses: actions/upload-artifact@v4
        with:
          name: pavonine-teleprompter
          path: pavonine-teleprompter-${{ github.sha }}.tgz
          if-no-files-found: error
